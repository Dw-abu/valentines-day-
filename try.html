<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lusu pondatiii❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(-45deg,#ff4e8a,#ff99c8,#ff6ec7,#ff2e74);
    background-size:400% 400%;
    animation:gradientMove 10s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Reel Glass Card */
.card{
    position:relative;
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    background-image: url("myphoto.jpg");
    backdrop-filter:blur(15px);
    text-align:center;
    color:white;
    box-shadow:0 15px 50px rgba(0,0,0,0.4);
    animation:fadeIn 1.5s ease;

 
}
@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    font-size:36px;
    margin-bottom:10px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}

.question{
    font-size:20px;
    margin:20px 0;
}

.buttons{
    position:relative;
    height:60px;
}

button{
    padding:12px 28px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    position:absolute;
    transition:0.3s;
}

#yesBtn{
    background:white;
    color:#ff2e74;
    left:20%;
    font-weight:bold;
    box-shadow:0 0 15px white;
}

#noBtn{
    background:#333;
    color:white;
    right:20%;
}

/* Love Letter */
.love-letter{
    margin-top:20px;
    font-size:17px;
    min-height:140px;
    white-space:pre-wrap;
}

/* Ring */
.ring{
    font-size:90px;
    margin-top:20px;
    display:none;
}

@keyframes ringDrop{
    0%{transform:translateY(-250px) scale(0);}
    70%{transform:translateY(20px) scale(1.2);}
    100%{transform:translateY(0) scale(1);}
}

/* Floating Hearts */
.heart{
    position:absolute;
    font-size:20px;
    animation:float 5s linear infinite;
}

@keyframes float{
    0%{transform:translateY(100vh); opacity:1;}
    100%{transform:translateY(-10vh); opacity:0;}
}
</style>
</head>

<body>

<div class="card">

<h1>Sranya ❤️</h1>

<div class="question">Will You Marry Me? 💖</div>

<div class="buttons">
    <button id="yesBtn">YES 💍</button>
    <button id="noBtn">No 😜</button>
</div>

<div class="love-letter" id="loveLetter"></div>

<div class="ring" id="ring">💍</div>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const loveLetter = document.getElementById("loveLetter");
const ring = document.getElementById("ring");

/* No Button Runs Away */
noBtn.addEventListener("mouseover", moveButton);

function moveButton(){
    const card = document.querySelector(".card");
    const cardRect = card.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const maxX = cardRect.width - btnRect.width;
    const maxY = cardRect.height - btnRect.height;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

/* YES Click */
yesBtn.addEventListener("click",()=>{
    startLetter();
    launchConfetti();

    ring.style.display="block";
    ring.style.animation="ringDrop 1s ease forwards";

    yesBtn.style.display="none";
    noBtn.style.display="none";
});

/* Love Letter Typing */
const text = `
OIII MENTALL ❤️,

From the day you entered my life,
everything became brighter and happier.

Your smile is my peace.
Your voice is my comfort.
Your love is my strength.

I promise to respect you,
care for you,
and stand by you forever.

Will you be mine for a forever? 💍❤️
`;

function startLetter(){
    let i = 0;
    function type(){
        if(i < text.length){
            loveLetter.innerHTML += text.charAt(i);
            i++;
            setTimeout(type, 35);
        }
    }
    type();
}

/* Confetti */
function launchConfetti(){
    for(let i=0;i<150;i++){
        let conf = document.createElement("div");
        conf.style.position="absolute";
        conf.style.width="8px";
        conf.style.height="8px";
        conf.style.background="hsl("+Math.random()*360+"deg,100%,50%)";
        conf.style.top="-10px";
        conf.style.left=Math.random()*100+"vw";
        conf.style.opacity="1";
        conf.style.transition="all 3s ease";
        document.body.appendChild(conf);

        setTimeout(()=>{
            conf.style.top="100vh";
            conf.style.opacity="0";
        },10);

        setTimeout(()=>{
            conf.remove();
        },3000);
    }
}

/* Floating Hearts */
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=Math.random()*20+10+"px";
    heart.style.animationDuration=Math.random()*3+3+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
}
setInterval(createHeart,300);

</script>

</body>
</html>
